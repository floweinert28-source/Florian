<script>
(function () {
  /* Startfehler sichtbar machen: statt einer weißen Seite erscheint die Meldung mit Hilfe-Knöpfen */
  function startFail(e) {
    console.error(e); var main = document.getElementById('main'); if (!main) return;
    var msg = String(e && (e.stack || e.message) || e).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    main.innerHTML = '<div style="max-width:720px;margin:40px auto;padding:24px;font:15px/1.5 Inter,Roboto,sans-serif;color:#eee;background:#161616;border:1px solid #333;border-radius:14px">'
      + '<h2 style="margin:0 0 8px;font-size:20px">Journalyst konnte nicht starten</h2><p style="margin:0 0 14px;color:#aaa">Bitte diese Meldung weitergeben:</p>'
      + '<pre style="white-space:pre-wrap;word-break:break-word;background:#0d0d0d;padding:12px;border-radius:10px;font-size:12px;max-height:240px;overflow:auto">' + msg + '</pre>'
      + '<p style="color:#aaa">Browser: ' + String(navigator.userAgent).replace(/</g, '&lt;') + '</p>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button id="sf-sample" style="padding:10px 14px;border-radius:10px;border:1px solid #444;background:#222;color:#eee;cursor:pointer">Beispieldaten entfernen und neu laden</button>'
      + '<button id="sf-reset" style="padding:10px 14px;border-radius:10px;border:1px solid #633;background:#2a1414;color:#f8caca;cursor:pointer">Alle lokalen Daten löschen und neu laden</button></div></div>';
    var b1 = document.getElementById('sf-sample'), b2 = document.getElementById('sf-reset');
    if (b1) b1.onclick = function () { try { if (typeof Store !== 'undefined' && Store.removeSample) Store.removeSample(); } catch (err) { console.warn(err); } try { var k = 'trading-journal-web-v1', d = JSON.parse(localStorage.getItem(k) || '{}'); if (d.settings) { d.settings.sampleInstalled = false; d.settings.sampleVersion = 99; localStorage.setItem(k, JSON.stringify(d)); } } catch (err) { console.warn(err); } location.reload(); };
    if (b2) b2.onclick = function () { if (confirm('Wirklich alle lokalen Daten dieses Journals löschen?')) { try { localStorage.removeItem('trading-journal-web-v1'); } catch (err) { console.warn(err); } location.reload(); } };
  }
  window.addEventListener('error', function (ev) { var main = document.getElementById('main'); if (main && (!main.innerHTML.trim() || main.querySelector('.boot'))) startFail(ev.error || ev.message); /* Startfehler: auch wenn noch die Ladeanzeige steht */ });
  try {
    Store.load();
    if (window.I18N) I18N.setLang(Store.settings.language || 'de');
    if (!Store.settings.onboarded) { if (!Store.trades().length) Store.installSample(); Store.settings.onboarded = true; Store.saveNow(); }
    Theme.apply(Store.settings);
    App.bind();
    App.render();
  } catch (e) { startFail(e); }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return; const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable || document.querySelector('.modal-bg')) return;
    const map = { '1': 'dashboard', '2': 'trades', '3': 'day', '4': 'stats', '5': 'notebook', '6': 'progress', '7': 'ruhepunkt', '8': 'mentor', '9': 'shadow', '0': 'replay' };
    if (map[e.key]) { location.hash = '#/' + map[e.key]; } else if (e.key === 'n' || e.key === 'N') { App.openTradeEditor(null); }
  });
})();
</script>
