<script>
(function () {
  /* Startfehler: statt einer weißen Seite ein freundlicher Hinweis mit Hilfe-Knöpfen. Technische Details (Meldung, Stack, Browser)
     stehen nicht auf der Seite, sondern nur in der Konsole und im Fehlerbericht zum Kopieren */
  function startFail(e) {
    console.error(e); var main = document.getElementById('main'); if (!main) return;
    var report = ['Journalyst: Startfehler', new Date().toISOString(), String(e && (e.stack || e.message) || e), navigator.userAgent].join('\n');
    var btn = 'padding:10px 14px;border-radius:10px;border:1px solid #3a3835;background:#1f1e1c;color:#f2f0ec;cursor:pointer;font:inherit;min-height:44px';
    main.innerHTML = '<div role="alert" style="max-width:640px;margin:40px auto;padding:24px;font:15px/1.5 Onest,system-ui,-apple-system,sans-serif;color:#f2f0ec;background:#151412;border:1px solid #34322e;border-radius:12px">'
      + '<h2 style="margin:0 0 8px;font-size:20px">Journalyst konnte nicht starten</h2>'
      + '<p style="margin:0 0 16px;color:#bcb8b1">Deine Daten sind nicht verloren, sie liegen weiter in diesem Browser. Lade die Seite neu. Hilft das nicht, entferne die Beispieldaten oder schick uns den Fehlerbericht.</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button id="sf-reload" style="' + btn + ';background:#ede6da;color:#15130f;border-color:#ede6da;font-weight:600">Neu laden</button>'
      + '<button id="sf-sample" style="' + btn + '">Beispieldaten entfernen und neu laden</button><button id="sf-copy" style="' + btn + '">Fehlerbericht kopieren</button></div>'
      + '<p style="margin:20px 0 8px;color:#948f88;font-size:13px">Nur wenn gar nichts hilft:</p><button id="sf-reset" style="' + btn + ';border-color:#5a2a2a;background:#241414;color:#f4c4c4">Alle lokalen Daten löschen und neu laden</button></div>';
    var $ = function (id) { return document.getElementById(id); };
    $('sf-reload').onclick = function () { location.reload(); };
    $('sf-sample').onclick = function () { try { if (typeof Store !== 'undefined' && Store.removeSample) Store.removeSample(); } catch (err) { console.warn(err); } try { var k = 'trading-journal-web-v1', d = JSON.parse(localStorage.getItem(k) || '{}'); if (d.settings) { d.settings.sampleInstalled = false; d.settings.sampleVersion = 99; localStorage.setItem(k, JSON.stringify(d)); } } catch (err) { console.warn(err); } location.reload(); };
    $('sf-copy').onclick = function () { var b = this; var done = function (ok) { b.textContent = ok ? 'Fehlerbericht kopiert' : 'Kopieren ging nicht'; }; try { navigator.clipboard.writeText(report).then(function () { done(true); }, function () { done(false); }); } catch (err) { done(false); } };
    /* zweistufig statt confirm(): der erste Klick fragt nach, erst der zweite löscht */
    $('sf-reset').onclick = function () { if (!this.dataset.sure) { this.dataset.sure = '1'; this.textContent = 'Wirklich alles löschen? Noch einmal klicken'; return; } try { localStorage.removeItem('trading-journal-web-v1'); } catch (err) { console.warn(err); } location.reload(); };
  }
  window.addEventListener('error', function (ev) { var main = document.getElementById('main'); if (main && (!main.innerHTML.trim() || main.querySelector('.boot'))) startFail(ev.error || ev.message); /* Startfehler: auch wenn noch die Ladeanzeige steht */ });
  if (window.PCView && PCView.maybeStart()) return; /* PC-Ansicht auf dem Handy: die App läuft im eingebetteten Fenster */
  try {
    Store.load();
    if (window.I18N) I18N.setLang(Store.settings.language || 'de');
    if (!Store.settings.onboarded) { if (!Store.trades().length) Store.installSample(); Store.settings.onboarded = true; Store.saveNow(); }
    Theme.apply(Store.settings);
    App.bind();
    App.render();
  } catch (e) { startFail(e); }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return; const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable || document.querySelector('.modal-bg')) return;
    const map = { '1': 'dashboard', '2': 'trades', '3': 'day', '4': 'stats', '5': 'notebook', '6': 'progress', '7': 'ruhepunkt', '8': 'mentor', '9': 'shadow', '0': 'replay' };
    if (map[e.key]) { location.hash = '#/' + map[e.key]; } else if (e.key === 'n' || e.key === 'N') { App.openTradeEditor(null); }
  });
})();
</script>
