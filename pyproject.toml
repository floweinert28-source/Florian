[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tasksbot"
version = "1.0.0"
description = "Discord-Bot, der Aufgaben in einem Channel verwaltet"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4,<3", "python-dotenv>=1.0"]

[tool.setuptools]
packages = ["tasksbot", "tasksbot.cogs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tasksbot.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
